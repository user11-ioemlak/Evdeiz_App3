name: Build Android APK & iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Derlenecek platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  build-android:
    name: Build Android APK (Ubuntu)
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Copy App icons
        run: node copy-app-icons.js

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prototype-Android-APK
          path: android/app/build/outputs/apk/release/*.apk

  build-ios:
    name: Build iOS IPA (macOS)
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'ios'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Copy App icons
        run: node copy-app-icons.js

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build iOS Archive
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          SCHEME=$(basename *.xcodeproj .xcodeproj 2>/dev/null | head -n 1)
          echo "Bulunan Workspace: $WORKSPACE, Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath build/Prototype.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p ios/build/Payload
          APP_PATH=$(find ios/build/Prototype.xcarchive/Products/Applications -name "*.app" | head -n 1)
          node copy-app-icons.js --app-path "$APP_PATH"
          cp -r "$APP_PATH" ios/build/Payload/
          cd ios/build && zip -r Prototype.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prototype-iOS-IPA
          path: ios/build/Prototype.ipa
